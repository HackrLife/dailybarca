name: daily-edition

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull the 50-site pool
        run: python scripts/source_engine.py
      - name: Commit sourced edition
        run: |
          git config user.name "dailybarca-bot"
          git config user.email "bot@dailybarca.com"
          git add data/sourced
          git diff --cached --quiet || git commit -m "chore: sourced stories $(date -u +%F)"
          git push
